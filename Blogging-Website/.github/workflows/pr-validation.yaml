name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    name: Linting Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML files
        run: htmlhint "**/*.html"

      - name: Install Stylelint
        run: |
          npm install -g stylelint
          npm install -g stylelint-config-standard

      - name: Lint CSS files
        run: stylelint "**/*.css"

  build:
    name: Build Job
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Parcel
        run: npm install -g parcel

      - name: Build project
        run: parcel build src/*.html --dist-dir dist